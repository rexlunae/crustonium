name: Cargo Build CI

# Phase 1.2: Tooling Development - CI/CD Integration
# Phase 2 Tier 2: Hybrid Build Support
# 
# This workflow builds and tests Rust code using Cargo.
#
# Note: Tier 2 components (e.g., ble-scan-parser) require GN-generated headers
# and are excluded from this pure Cargo CI. They are tested in the full
# Chromium/GN CI environment where hybrid builds are supported.
# See docs/rust/phase2/TIER_2_PLANNING.md for details.

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0  # Disable incremental compilation in CI

jobs:
  # Quick checks (formatting, linting)
  check:
    name: Quick Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Check formatting
      run: cargo fmt --all -- --check
      continue-on-error: true  # Don't fail on formatting in early phase
    
    - name: Run clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
      continue-on-error: true  # Don't fail on lints in early phase

  # Build on multiple platforms
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-
    
    - name: Cache Cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-index-
    
    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-build-
    
    - name: Build workspace
      run: |
        # Build workspace excluding Tier 2 components that require GN
        # Tier 2 components (ble-scan-parser) require GN-generated headers
        # and are tested in the full Chromium CI environment
        cargo build --workspace --exclude ble-scan-parser --verbose
    
    - name: Build workspace (release)
      run: cargo build --workspace --exclude ble-scan-parser --release --verbose
      if: matrix.os == 'ubuntu-latest'  # Only on Linux to save time

  # Run tests
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-test-
    
    - name: Run tests
      run: |
        # Test workspace excluding Tier 2 components that require GN
        cargo test --workspace --exclude ble-scan-parser --verbose
    
    - name: Run doc tests
      run: cargo test --workspace --exclude ble-scan-parser --doc --verbose
      if: matrix.os == 'ubuntu-latest'

  # Security audit
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-audit
      run: cargo install cargo-audit
    
    - name: Run cargo audit
      run: cargo audit
      continue-on-error: true  # Don't fail on advisories in early phase

  # Dependency checking
  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-deny
      run: cargo install cargo-deny
    
    - name: Run cargo deny
      run: cargo deny check
      continue-on-error: true  # Don't fail on denies in early phase

  # Coverage (optional, can be slow)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install tarpaulin
      run: cargo install cargo-tarpaulin
    
    - name: Generate coverage
      run: cargo tarpaulin --workspace --exclude ble-scan-parser --out Xml --verbose
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./cobertura.xml
      continue-on-error: true

  # Summary
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [check, build, test]
    if: always()
    steps:
    - name: Check all jobs
      run: |
        if [[ "${{ needs.check.result }}" == "success" ]] && \
           [[ "${{ needs.build.result }}" == "success" ]] && \
           [[ "${{ needs.test.result }}" == "success" ]]; then
          echo "All CI jobs passed!"
          exit 0
        else
          echo "Some CI jobs failed"
          exit 1
        fi
