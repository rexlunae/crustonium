# Cargo.toml for Media Filters Component
# This enables building the Symphonia audio decoder FFI glue via Cargo

[package]
name = "media-filters"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "symphonia_glue"
crate-type = ["staticlib", "rlib"]
path = "symphonia_glue.rs"

[dependencies]
# FFI support
cxx = { workspace = true }

# Audio decoding with Symphonia
# symphonia_glue.rs is written against the 0.6 API (codecs::audio::well_known,
# GenericAudioBufferRef); 0.5 does not compile it.
symphonia = "0.6"

[build-dependencies]
cxx-build = { workspace = true }
