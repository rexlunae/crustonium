# Cargo Workspace for Chromium/Crustonium
# Phase 1.1: Research and Prototyping - Workspace Structure Prototype
#
# This is a prototype workspace configuration for evaluating Cargo
# as the primary build system. During Phase 1, this will coexist
# with the existing GN/Ninja build system.

[workspace]
resolver = "2"

# Prototype members - starting with existing Rust components
members = [
    "prototypes/cargo_cpp_integration",
    "prototypes/workspace_structure_test",
    # Existing components being migrated to Cargo:
    "components/qr_code_generator",
    # Additional components added in Phase 1.2:
    "components/facilitated_payments/core/validation",
    "components/user_data_importer/utility/parsing_ffi",
    "media/filters",
    "testing/rust_gtest_interop",
    "testing/rust_gtest_interop/gtest_attribute",
    "testing/rust_gtest_interop/chromium_macro_shim",
    # Phase 2 Tier 1 migrations:
    "tools/crates/gnrt",
    # Phase 2 Tier 2 migrations (complex C++ FFI):
    # Note: Tier 2 components require GN-generated headers and hybrid build approach
    # See docs/rust/phase2/TIER_2_PLANNING.md for migration strategy
    "device/bluetooth/bluez/ble_scan_parser",  # First Tier 2 component - requires GN build first
    "mojo/public/rust/system",  # Second Tier 2 component - requires GN-generated bindings
]

# Components not yet ready for Cargo migration
exclude = [
    "third_party",
    "out",
    "target",
    "build",
]

# Workspace-wide dependency versions
# This ensures all crates use the same version of common dependencies
[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"

# FFI and C++ integration
cxx = "1.0"
cc = "1.0"

# Build dependencies
cxx-build = "1.0"

# Testing
criterion = "0.5"

# Component-specific dependencies
qr_code = "2.0"
zip = "6.0"

# Proc macro dependencies
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

# Workspace metadata
[workspace.package]
version = "1.0.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/rexlunae/crustonium"

# Build profiles optimized for Chromium's needs
[profile.dev]
opt-level = 0
debug = true
# Faster linking in development
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false

# Production profile with maximum optimization
[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Profile for performance testing
[profile.bench]
inherits = "release"
debug = true
